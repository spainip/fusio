apiVersion: v1
kind: Service
metadata:
  name: fusio
  namespace: fusio
  labels:
    app.kubernetes.io/name: fusio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fusio
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fusio-dashboard-root-redirect
  namespace: fusio
spec:
  redirectRegex:
    regex: "^https?://api-admin\\.spainip\\.es/$"
    replacement: "https://api-admin.spainip.es/apps/fusio/"
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusio-api
  namespace: fusio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: acmeresolver
spec:
  ingressClassName: traefik
  rules:
    - host: api.spainip.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fusio
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusio-dashboard
  namespace: fusio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: acmeresolver
    traefik.ingress.kubernetes.io/router.middlewares: fusio-fusio-dashboard-root-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api-admin.spainip.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fusio
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusio
  namespace: fusio
  labels:
    app.kubernetes.io/name: fusio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fusio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fusio
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fusio
          image: fusio/fusio:7.1.0
          imagePullPolicy: IfNotPresent
          workingDir: /var/www/html/fusio
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              base_path="${BASE_PATH:-/apps}"
              find public/apps -type f \( -name '*.html' -o -name '.htaccess' \) -exec sed -i "s#\${BASE_PATH}#${base_path}#g" {} +
              until php bin/fusio migrate --no-interaction; do
                sleep 5
              done
              php bin/fusio marketplace:env - --no-interaction || true
              php bin/fusio marketplace:install fusio --no-interaction || true
              php bin/fusio marketplace:install developer --no-interaction || true
              php bin/fusio marketplace:install account --no-interaction || true
              php bin/fusio marketplace:install swagger-ui --no-interaction || true
              exec apache2-foreground
          envFrom:
            - secretRef:
                name: fusio-secrets
          env:
            - name: APP_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: fusio-secrets
                  key: FUSIO_PROJECT_KEY
            - name: APP_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: fusio-secrets
                  key: FUSIO_CONNECTION
            - name: APP_MAILER
              value: native://default
            - name: APP_MESSENGER
              value: doctrine://default?table_name=fusio_messenger
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
